name: Refresh public update manifest
on:
  release:
    types: [published, edited, deleted, unpublished]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-update-manifest
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'littletaro97-arch/honor-magic-visual-community'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Generate from published releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/write-update-manifest.py --fetch --output updates/update.json
      - name: Commit public metadata only
        run: |
          git add -- updates/update.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public update manifest'
          git push origin HEAD:main
